name = "intercom-youtrack"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Non-secret configuration. Tokens are set with `wrangler secret put <NAME>`.
[vars]
# MASTER SWITCH. "false" makes this worker ignore every event and create
# nothing. Anything else (including a missing value) leaves it running. The
# two workers have separate config, so this turns off Intercom ONLY.
#   off:  set to "false", then npx wrangler deploy
#   on:   set to "true",  then npx wrangler deploy
ENABLED = "true"

YOUTRACK_BASE_URL = "https://myrealprofit.youtrack.cloud"
YOUTRACK_PROJECT_ID = "0-18"
# Intercom workspace (app) id — used to build conversation deep-links.
INTERCOM_APP_ID = "agc8lkpy"
# Admin IDs that are bots (e.g. Fin / Operator). Assignments to these do NOT
# create a ticket — only assignment to a real human teammate does.
# 5286994 = Fin (operator+agc8lkpy@intercom.io, no inbox seat)
INTERCOM_EXCLUDE_ADMIN_IDS = "5286994"

# Optional allowlist of contact emails. Left EMPTY on purpose: most Intercom
# traffic is anonymous website visitors who have no email until Fin asks for
# one, so filtering on it would silently drop the majority of escalations.
INTERCOM_TEST_CONTACT_EMAILS = ""

# Admin the internal note is posted as. Empty = whoever owns INTERCOM_TOKEN.
INTERCOM_NOTE_ADMIN_ID = ""

# Fin resolution states that mean "handed to humans". Add to this list if the
# skip log ever reports a state that should have created a ticket.
INTERCOM_HANDOFF_STATES = "escalated,routed_to_team"

# Quiet period after the customer's last message before the ticket is written.
# The cron sweeps once a minute, so the real delay is this plus up to 60s.
INTERCOM_DEBOUNCE_SECONDS = "180"

# Bold first line of the internal note. Clear this when testing is over.
INTERCOM_NOTE_PREFIX = "TESTING HELPDESK"

# Dedupe store, keyed by conversation id, so a reassignment or a webhook
# retry cannot produce a second ticket for the same conversation. Separate
# namespace from the Slack worker's despite the shared binding name.
[[kv_namespaces]]
binding = "DEDUPE"
id = "b01eac0c21874f45811a49c44cb98fe0"

# Sweeps the pending timers. A Worker cannot sleep for minutes, so the wait
# lives in KV and this pass picks up whatever has come due.
[triggers]
crons = ["* * * * *"]

# Retained logs, readable in the Cloudflare dashboard under this worker's
# Observability tab. Without this, logs exist only while `wrangler tail` is
# attached to somebody's terminal — so an overnight failure leaves no trace.
[observability]
enabled = true
head_sampling_rate = 1
